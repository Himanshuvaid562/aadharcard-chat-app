<!DOCTYPE html>
<html>
<head>
    <title>Aadhaar Chat - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

<div class="login-container">
    <h1>Aadhaar Chat</h1>
    <p>Secure Messaging Platform</p>

    <form id="loginForm">
        <input type="text" id="aadhaar" placeholder="Enter 12-digit Aadhaar" required maxlength="12">
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p class="switch">New user? <a href="register.html">Register</a></p>
</div>

<script src="js/login.js"></script>
</body>
</html>
